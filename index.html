<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOBE 好き顔57</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff8f7;color:#4b3033}.wrap{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top, 0px) + 54px) 14px 40px}h1{text-align:center;font-family:Georgia,"Yu Mincho",serif;font-size:27px;margin:10px 0 4px;color:#6d4246;letter-spacing:.5px}.sub{text-align:center;color:#a56f75;font-size:13px;margin-bottom:20px}.panel{background:#fff;border:1px solid #efc9cb;border-radius:26px;padding:16px;box-shadow:0 10px 30px #b85f6818, inset 0 0 0 4px #fff7f6}.progress{height:8px;background:#f4dfe0;border-radius:9px;overflow:hidden;margin-bottom:14px}.bar{height:100%;background:#c97980}.round{text-align:center;font-weight:800;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:linear-gradient(180deg,#fff,#fff9f8);border:2px solid #efd0d1;border-radius:20px;padding:7px;position:relative;cursor:pointer;box-shadow:0 5px 14px #a85d6510}.card.sel{border-color:#c97980;box-shadow:0 0 0 3px #c9798025}.photo{aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#f6e8e7;border:1px solid #efd0d1}.photo img{width:100%;height:100%;object-fit:cover}.name{text-align:center;font-weight:800;margin-top:8px}.group{text-align:center;font-size:11px;color:#b85f68;min-height:16px;margin:3px 0 1px}.starline{text-align:center;color:#c97980;font-size:12px;letter-spacing:1px;margin:0 0 4px}.check{position:absolute;right:13px;top:13px;width:28px;height:28px;border-radius:50%;background:white;border:2px solid #ddd;text-align:center;line-height:24px;color:transparent}.sel .check{background:#c97980;border-color:#c97980;color:white}.btn{display:block;margin:18px auto 0;border:0;border-radius:99px;background:#c97980;color:#fff;font-weight:800;padding:14px 28px;font-size:15px}.note{text-align:center;color:#a56f75;font-size:12px;margin-top:9px}.hidden{display:none}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rank{background:white;border:1px solid #efd0d1;border-radius:16px;padding:7px}.rank:first-child{grid-column:1/-1}.rank:first-child .photo{max-width:260px;margin:auto}.place{text-align:center;font-weight:900;margin-top:7px}.small{text-align:center;font-size:11px;color:#987b87}.grid .card:last-child:nth-child(odd){grid-column:1/-1;width:calc((100% - 12px)/2);justify-self:center}@media(min-width:650px){.grid{grid-template-columns:repeat(5,1fr)}.grid .card:last-child:nth-child(odd){grid-column:auto;width:auto;justify-self:stretch}}
</style></head><body><div class="wrap"><h1>TOBE 好き顔57 ♡</h1><div class="sub">57人から、あなたの好きな顔TOP9を決めよう</div><section id="start" class="panel"><p style="text-align:center;line-height:1.8">5人ずつ表示されるので、<b>好きな顔を1〜3人</b>選んでね。<br>全員が同じ5回ずつ登場して、最後にTOP9を発表します。</p><button class="btn" onclick="start()">スタート ✦</button></section><section id="game" class="panel hidden"><div class="progress"><div id="bar" class="bar"></div></div><div id="round" class="round"></div><div id="grid" class="grid"></div><button class="btn" onclick="next()">次へ ✦</button><div id="note" class="note"></div></section><section id="result" class="panel hidden"><h2 style="text-align:center">👑 あなたの好き顔 TOP9</h2><div id="results" class="results"></div><button class="btn" onclick="location.reload()">もう一度やる</button></section></div><script>
const M=[{"id": 1, "name": "大東立樹", "group": "CLASS SEVEN"}, {"id": 2, "name": "髙野秀侑", "group": "CLASS SEVEN"}, {"id": 3, "name": "高田憐", "group": "CLASS SEVEN"}, {"id": 4, "name": "近藤大海", "group": "CLASS SEVEN"}, {"id": 5, "name": "横田大雅", "group": "CLASS SEVEN"}, {"id": 6, "name": "星慧音", "group": "CLASS SEVEN"}, {"id": 7, "name": "中澤漣", "group": "CLASS SEVEN"}, {"id": 8, "name": "三宅健", "group": ""}, {"id": 9, "name": "北山宏光", "group": ""}, {"id": 10, "name": "平野紫耀", "group": "Number_i"}, {"id": 11, "name": "神宮寺勇太", "group": "Number_i"}, {"id": 12, "name": "岸優太", "group": "Number_i"}, {"id": 13, "name": "佐藤新", "group": "IMP."}, {"id": 14, "name": "基俊介", "group": "IMP."}, {"id": 15, "name": "鈴木大河", "group": "IMP."}, {"id": 16, "name": "影山拓也", "group": "IMP."}, {"id": 17, "name": "松井奏", "group": "IMP."}, {"id": 18, "name": "横原悠毅", "group": "IMP."}, {"id": 19, "name": "椿泰我", "group": "IMP."}, {"id": 20, "name": "ISSEI", "group": ""}, {"id": 21, "name": "赤﨑渚人", "group": "TRAINEE"}, {"id": 22, "name": "清水翔太", "group": "TRAINEE"}, {"id": 23, "name": "岡本和蕗", "group": "TRAINEE"}, {"id": 24, "name": "新藤琉空", "group": "TRAINEE"}, {"id": 25, "name": "島田泰我", "group": "wink first"}, {"id": 26, "name": "藤代翔真", "group": "wink first"}, {"id": 27, "name": "松﨑光", "group": "wink first"}, {"id": 28, "name": "川田瑠輝", "group": "wink first"}, {"id": 29, "name": "小助川優", "group": "wink first"}, {"id": 30, "name": "稲垣樹", "group": "TRAINEE"}, {"id": 31, "name": "林星絆", "group": "TRAINEE"}, {"id": 32, "name": "後藤琉斗", "group": "TRAINEE"}, {"id": 33, "name": "庄司奏多", "group": "TRAINEE"}, {"id": 34, "name": "鹿島央結", "group": "TRAINEE"}, {"id": 35, "name": "佐藤悠月", "group": "TRAINEE"}, {"id": 36, "name": "竹川俊葵", "group": "TRAINEE"}, {"id": 37, "name": "須田瑚和", "group": "TRAINEE"}, {"id": 38, "name": "濵津成那", "group": "TRAINEE"}, {"id": 39, "name": "萩原楓生", "group": "TRAINEE"}, {"id": 40, "name": "畠山颯空", "group": "TRAINEE"}, {"id": 41, "name": "日野功壽", "group": "TRAINEE"}, {"id": 42, "name": "田中陽奈大", "group": "TRAINEE"}, {"id": 43, "name": "関塚伝", "group": "TRAINEE"}, {"id": 44, "name": "松平将馬", "group": "TRAINEE"}, {"id": 45, "name": "鶴田悠悟", "group": "TRAINEE"}, {"id": 46, "name": "佐藤陸", "group": "TRAINEE"}, {"id": 47, "name": "坪木翔愛", "group": "TRAINEE"}, {"id": 48, "name": "丘山凛", "group": "TRAINEE"}, {"id": 49, "name": "桐山蒼馬", "group": "TRAINEE"}, {"id": 50, "name": "根本理功", "group": "TRAINEE"}, {"id": 51, "name": "山根叶大", "group": "TRAINEE"}, {"id": 52, "name": "金子侑羽太", "group": "TRAINEE"}, {"id": 53, "name": "小早川達斗", "group": "TRAINEE"}, {"id": 54, "name": "井上息吹", "group": "TRAINEE"}, {"id": 55, "name": "大久保潤", "group": "TRAINEE"}, {"id": 56, "name": "佐藤颯良", "group": "TRAINEE"}, {"id": 57, "name": "滝沢秀明", "group": ""}]; let qs=[],q=0,sel=new Set(),score={}; const $=x=>document.getElementById(x); function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b} function make(){const order=shuffle(M.map(m=>m.id)),off=[0,1,3,7,15],r=[];for(let i=0;i<57;i++)r.push(off.map(o=>order[(i+o)%57]));return r} function member(id){return M.find(x=>x.id===id)} function start(){M.forEach(m=>score[m.id]=0);qs=make();$('start').classList.add('hidden');$('game').classList.remove('hidden');render()} function render(){sel=new Set();$('bar').style.width=(q/qs.length*100)+'%';$('round').textContent=`${q+1} / ${qs.length}　この中から1〜3人選んでね`; $('grid').innerHTML=qs[q].map(id=>{let m=member(id);return `<div class="card" data-id="${id}" onclick="pick(${id})"><div class="photo"><img src="${String(id).padStart(2,'0')}.jpg"></div><div class="check">✓</div><div class="name">${m.name}</div><div class="group">${m.group}</div><div class="starline">── ✦ ──</div></div>`}).join('');note()} function pick(id){if(sel.has(id))sel.delete(id);else if(sel.size<3)sel.add(id);document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',sel.has(+c.dataset.id)));note()} function note(){$('note').textContent=`${sel.size}人選択中`} function next(){if(!sel.size){alert('1人以上選んでね♡');return}sel.forEach(id=>score[id]++);q++;if(q>=qs.length)return result();render();scrollTo(0,0)} function result(){$('game').classList.add('hidden');$('result').classList.remove('hidden');let a=[...M].sort((x,y)=>score[y.id]-score[x.id]||x.id-y.id).slice(0,9);$('results').innerHTML=a.map((m,i)=>`<div class="rank"><div class="photo"><img src="${String(m.id).padStart(2,'0')}.jpg"></div><div class="place">${i+1}位 ${m.name}</div><div class="group">${m.group}</div><div class="small">${score[m.id]}回選択</div></div>`).join('');scrollTo(0,0)}</script></body></html>
