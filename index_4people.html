<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOBE 好き顔57</title><style>

columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:linear-gradient(180deg,#fffdfd,#fff8f8);border:1.5px solid #e59aa5;border-radius:20px;padding:7px;position:relative;cursor:pointer;box-shadow:0 5px 14px rgba(153,53,66,.08)}.card:before,.card:after{content:"✧";position:absolute;color:#ce5969;font-size:10px}.card:before{left:-4px;top:-8px}.card:after{right:-4px;bottom:-8px}.card.sel{border-color:#c34255;box-shadow:0 0 0 3px rgba(202,76,94,.13),0 5px 14px rgba(153,53,66,.08)}.photo{aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#f0eeee,#e5e5e5);border:1px solid #efd3d6}.photo img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}.photo img.kitayama{object-position:center 22%}.name{text-align:center;font-family:"Yu Mincho","Times New Roman",serif;font-weight:800;margin-top:8px;color:#2f2023;font-size:15px}.group{text-align:center;font-family:Georgia,serif;font-size:11px;color:#b94153;min-height:16px;margin:3px 0 0}.starline{text-align:center;color:#c95364;font-size:12px;letter-spacing:1px;margin:0 0 3px}.check{position:absolute;right:11px;top:10px;width:35px;height:35px;border-radius:50%;border:1.8px solid #d35d6e;background:#fffafa;display:grid;place-items:center;font-size:20px;line-height:1;color:#cf596a;z-index:2;box-shadow:0 2px 8px rgba(144,48,61,.1)}.sel .check{background:#d75e70;color:white;transform:scale(1.04)}.btn{display:block;width:100%;margin:18px auto 0;border:1px solid #c95667;border-radius:99px;background:linear-gradient(90deg,#c95b6d,#df8593,#c95b6d);color:#fff;font-family:"Yu Mincho",serif;font-weight:800;padding:15px 28px;font-size:19px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.38),0 7px 16px rgba(164,55,70,.12)}.note{text-align:center;color:#9f5660;font-size:12px;margin-top:9px}
.start-copy{color:#A94F5C;font-family:"Klee One","Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic",sans-serif;font-weight:500;letter-spacing:.04em}.how{position:relative;margin-top:19px;background:rgba(255,249,249,.95);border:1.5px dashed #df929e;border-radius:24px;padding:24px 18px 20px 145px;box-shadow:0 8px 22px rgba(160,44,61,.05);min-height:205px}.how:before{display:none}.how-label{display:none}.how:after{content:"Enjoy\A TOBE ♡";white-space:pre;position:absolute;right:18px;bottom:20px;color:#d46c7b;font-family:"Snell Roundhand","Brush Script MT",cursive;font-size:18px;line-height:1.05;transform:rotate(-7deg);opacity:.95}.how h2{margin:0 0 16px;color:var(--deep);font-family:"Yu Mincho",serif;font-size:25px;position:relative}.how h2:after{content:"  ───── ✦ ───── ✦";color:#d56a7b;font-size:14px;letter-spacing:3px}.howrow{color:#A94F5C;display:flex;gap:12px;align-items:center;margin:11px 0;font-size:13px;line-height:1.55;padding-right:90px;font-family:"Klee One","Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic",sans-serif;font-weight:700;letter-spacing:.03em}.badge{flex:0 0 38px;height:38px;display:grid;place-items:center;background:#cf5c6d;color:#fff;clip-path:polygon(50% 0,61% 34%,98% 35%,68% 56%,79% 92%,50% 70%,21% 92%,32% 56%,2% 35%,39% 34%);font-family:Georgia,serif;font-weight:800;font-size:15px}.how:before{}.hidden{display:none}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rank{background:#fff;border:1px solid #efd0d4;border-radius:16px;padding:7px}.rank:first-child{grid-column:1/-1}.rank:first-child .photo{max-width:260px;margin:auto}.place{text-align:center;font-weight:900;margin-top:7px}.small{text-align:center;font-size:11px;color:#987b87}.grid .card:last-child:nth-child(odd){grid-column:1/-1;width:calc((100% - 13px)/2);justify-self:center}

</style></head><body><div class="wrap"><header class="hero"><h1><span>TOBE</span> <span class="title-cute">好き顔</span><span>57</span></h1><div class="sub">〜 57人から、あなたの好きな顔TOP9を決めよう 〜</div><div class="orn">⌇　♔　⌇<br>───　♡　───</div></header><section id="start" class="panel"><p class="start-copy" style="text-align:center;line-height:1.8">4人ずつ表示されるので、<b>0〜3人</b>選んでね⭐️<br>0人のままでも進めます。<br>全員が同じ4回ずつ登場して、<br>最後にTOP9を発表します👑</p><button class="btn" onclick="start()">スタート ✦</button></section><section id="game" class="panel hidden"><div class="progress"><div id="bar" class="bar"></div></div><div id="round" class="round"></div><div id="grid" class="grid"></div><button class="btn" onclick="next()">次へ 〉</button><div id="note" class="note"></div></section><section class="how"><div class="how-label">How to<br>play ♡</div><h2>あそびかた　✦</h2><div class="howrow"><span class="badge">1</span><span>毎回4人の中から、<b>好きな人を0〜3人</b>選んでください。0人でも次へ進めます。</span></div><div class="howrow"><span class="badge">2</span><span>全57回の質問で、<b>57人全員が同じ回数登場</b>します。</span></div><div class="howrow"><span class="badge">3</span><span>選んだ回数を集計し、最後にあなたの<b>TOP9を発表</b>します。</span></div></section><section id="result" class="panel hidden"><h2 style="text-align:center;color:#a73d49">♡ あなたの好き顔 TOP9 ♡</h2><div id="results" class="results"></div><button class="btn" onclick="location.reload()">もう一度やる</button></section></div><script>
const M=[{"id": 1, "name": "大東立樹", "group": "CLASS SEVEN"}, {"id": 2, "name": "髙野秀侑", "group": "CLASS SEVEN"}, {"id": 3, "name": "高田憐", "group": "CLASS SEVEN"}, {"id": 4, "name": "近藤大海", "group": "CLASS SEVEN"}, {"id": 5, "name": "横田大雅", "group": "CLASS SEVEN"}, {"id": 6, "name": "星慧音", "group": "CLASS SEVEN"}, {"id": 7, "name": "中澤漣", "group": "CLASS SEVEN"}, {"id": 8, "name": "三宅健", "group": ""}, {"id": 9, "name": "北山宏光", "group": ""}, {"id": 10, "name": "平野紫耀", "group": "Number_i"}, {"id": 11, "name": "神宮寺勇太", "group": "Number_i"}, {"id": 12, "name": "岸優太", "group": "Number_i"}, {"id": 13, "name": "佐藤新", "group": "IMP."}, {"id": 14, "name": "基俊介", "group": "IMP."}, {"id": 15, "name": "鈴木大河", "group": "IMP."}, {"id": 16, "name": "影山拓也", "group": "IMP."}, {"id": 17, "name": "松井奏", "group": "IMP."}, {"id": 18, "name": "横原悠毅", "group": "IMP."}, {"id": 19, "name": "椿泰我", "group": "IMP."}, {"id": 20, "name": "ISSEI", "group": ""}, {"id": 21, "name": "赤﨑渚人", "group": "TRAINEE"}, {"id": 22, "name": "清水翔太", "group": "TRAINEE"}, {"id": 23, "name": "岡本和蕗", "group": "TRAINEE"}, {"id": 24, "name": "新藤琉空", "group": "TRAINEE"}, {"id": 25, "name": "島田泰我", "group": "wink first"}, {"id": 26, "name": "藤代翔真", "group": "wink first"}, {"id": 27, "name": "松﨑光", "group": "wink first"}, {"id": 28, "name": "川田瑠輝", "group": "wink first"}, {"id": 29, "name": "小助川優", "group": "wink first"}, {"id": 30, "name": "稲垣樹", "group": "TRAINEE"}, {"id": 31, "name": "林星絆", "group": "TRAINEE"}, {"id": 32, "name": "後藤琉斗", "group": "TRAINEE"}, {"id": 33, "name": "庄司奏多", "group": "TRAINEE"}, {"id": 34, "name": "鹿島央結", "group": "TRAINEE"}, {"id": 35, "name": "佐藤悠月", "group": "TRAINEE"}, {"id": 36, "name": "竹川俊葵", "group": "TRAINEE"}, {"id": 37, "name": "須田瑚和", "group": "TRAINEE"}, {"id": 38, "name": "濵津成那", "group": "TRAINEE"}, {"id": 39, "name": "萩原楓生", "group": "TRAINEE"}, {"id": 40, "name": "畠山颯空", "group": "TRAINEE"}, {"id": 41, "name": "日野功壽", "group": "TRAINEE"}, {"id": 42, "name": "田中陽奈大", "group": "TRAINEE"}, {"id": 43, "name": "関塚伝", "group": "TRAINEE"}, {"id": 44, "name": "松平将馬", "group": "TRAINEE"}, {"id": 45, "name": "鶴田悠悟", "group": "TRAINEE"}, {"id": 46, "name": "佐藤陸", "group": "TRAINEE"}, {"id": 47, "name": "坪木翔愛", "group": "TRAINEE"}, {"id": 48, "name": "丘山凛", "group": "TRAINEE"}, {"id": 49, "name": "桐山蒼馬", "group": "TRAINEE"}, {"id": 50, "name": "根本理功", "group": "TRAINEE"}, {"id": 51, "name": "山根叶大", "group": "TRAINEE"}, {"id": 52, "name": "金子侑羽太", "group": "TRAINEE"}, {"id": 53, "name": "小早川達斗", "group": "TRAINEE"}, {"id": 54, "name": "井上息吹", "group": "TRAINEE"}, {"id": 55, "name": "大久保潤", "group": "TRAINEE"}, {"id": 56, "name": "佐藤颯良", "group": "TRAINEE"}, {"id": 57, "name": "滝沢秀明", "group": ""}]; let qs=[],q=0,sel=new Set(),score={}; const $=x=>document.getElementById(x); function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b} function make(){const order=shuffle(M.map(m=>m.id)),off=[0,1,7,19],r=[];for(let i=0;i<57;i++)r.push(off.map(o=>order[(i+o)%57]));return r} function member(id){return M.find(x=>x.id===id)} function start(){M.forEach(m=>score[m.id]=0);qs=make();$('start').classList.add('hidden');$('game').classList.remove('hidden');render()} function render(){sel=new Set();$('bar').style.width=(q/qs.length*100)+'%';$('round').textContent=`${q+1} / ${qs.length}　0〜3人選んでね（0人でもOK）`; $('grid').innerHTML=qs[q].map(id=>{let m=member(id);return `<div class="card" data-id="${id}" onclick="pick(${id})"><div class="photo"><img src="${String(id).padStart(2,'0')}.jpg" class="${id===9?'kitayama':''}"></div><div class="check">☆</div><div class="name">${m.name}</div><div class="group">${m.group}</div><div class="starline">── ✦ ──</div></div>`}).join('');note()} function pick(id){if(sel.has(id))sel.delete(id);else if(sel.size<3)sel.add(id);document.querySelectorAll('.card').forEach(c=>{const on=sel.has(+c.dataset.id);c.classList.toggle('sel',on);c.querySelector('.check').textContent=on?'★':'☆'});note()} function note(){$('note').textContent=sel.size?`${sel.size}人選択中`:'0人でも次へ進めます'} function next(){sel.forEach(id=>score[id]++);q++;if(q>=qs.length)return result();render();scrollTo(0,0)} function result(){$('game').classList.add('hidden');$('result').classList.remove('hidden');let a=[...M].sort((x,y)=>score[y.id]-score[x.id]||x.id-y.id).slice(0,9);$('results').innerHTML=a.map((m,i)=>`<div class="rank"><div class="photo"><img src="${String(m.id).padStart(2,'0')}.jpg" class="${m.id===9?'kitayama':''}"></div><div class="place">${i+1}位 ${m.name}</div><div class="group">${m.group}</div><div class="small">${score[m.id]}回選択</div></div>`).join('');scrollTo(0,0)}</script></body></html>
